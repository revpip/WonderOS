services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wonderos
      POSTGRES_USER: wonderos
      POSTGRES_PASSWORD: wonderos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderos -d wonderos"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wonderos-postgres:/var/lib/postgresql/data

volumes:
  wonderos-postgres:
