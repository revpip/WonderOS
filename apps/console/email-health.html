<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Health · WonderOS</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f5f3ef;color:#17201d}main{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:white;border:1px solid #ddd8cf;border-radius:16px;padding:18px;margin-top:18px}.n{font-size:2rem;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}button{padding:10px 14px;border-radius:10px;border:0;background:#17201d;color:white}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}table{font-size:.82rem}}</style><main><div class="top"><div><small>WONDER CONSOLE</small><h1>Email health</h1></div><button id="refresh">Refresh</button></div><p>Thirty-day delivery health, reputation risks and active suppressions.</p><div class="cards" id="cards"></div><section><h2>Active suppressions</h2><table><thead><tr><th>Email</th><th>Reason</th><th>Created</th></tr></thead><tbody id="suppressions"></tbody></table></section><section><h2>Recent provider events</h2><table><thead><tr><th>Event</th><th>Recipient</th><th>Message</th><th>Occurred</th></tr></thead><tbody id="events"></tbody></table></section><p id="status"></p></main><script>const api=localStorage.getItem('wonderos_api')||'http://localhost:8080';const token=sessionStorage.getItem('wonderos_token');const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!token){location='login.html';return}status.textContent='Loading…';const r=await fetch(api+'/v1/admin/email-health',{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok){status.textContent=j.error?.message||'Unable to load.';return}const d=j.data,s=d.summary||{};cards.innerHTML=['delivered','bounced','complained','deferred'].map(k=>`<div class=card><div>${e(k)}</div><div class=n>${e(s[k]||0)}</div></div>`).join('');suppressions.innerHTML=d.active_suppressions.map(x=>`<tr><td>${e(x.email)}</td><td>${e(x.reason)}</td><td>${e(x.created_at)}</td></tr>`).join('')||'<tr><td colspan=3>No active suppressions.</td></tr>';events.innerHTML=d.recent_events.map(x=>`<tr><td>${e(x.event_type)}</td><td>${e(x.recipient_email)}</td><td>${e(x.provider_message_id)}</td><td>${e(x.occurred_at)}</td></tr>`).join('');status.textContent='';}refresh.onclick=load;load();</script></html>
