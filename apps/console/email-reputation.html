<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Reputation · WonderOS</title><link rel="stylesheet" href="./assets/console.css"></head><body><main class="shell"><header><p class="eyebrow">WonderOS Administration</p><h1>Email Reputation</h1><p>Pause unsafe delivery, tune thresholds and release suppressions with a permanent audit trail.</p></header><section class="panel"><div id="metrics"></div><form id="settings"><label>Bounce-rate threshold <input id="bounce" type="number" min="0.0001" max="1" step="0.0001"></label><label>Complaint-rate threshold <input id="complaint" type="number" min="0.0001" max="1" step="0.0001"></label><label>Minimum sample size <input id="sample" type="number" min="1"></label><label>Status <select id="status"><option value="active">Active</option><option value="paused">Paused</option></select></label><label>Pause reason <textarea id="reason"></textarea></label><button>Save controls</button></form></section><section class="panel"><h2>Active suppressions</h2><div id="suppressions"></div></section><p id="message"></p></main><script>
const api='http://localhost:8080',token=sessionStorage.getItem('wonderos_session');if(!token)location.href='./login.html';const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const r=await fetch(api+path,{...options,headers});const j=await r.json();if(!j.success)throw new Error(j.error.message);return j.data}
async function load(){const d=await request('/v1/admin/email-reputation');const s=d.settings,m=d.metrics;metrics.innerHTML=`<h2>${esc(s.status)}</h2><p>${esc(m.delivered)} delivered · ${esc(m.bounces)} bounced/blocked · ${esc(m.complaints)} complaints</p><p>${esc(s.pause_reason||'No active pause reason.')}</p>`;bounce.value=s.bounce_rate_threshold;complaint.value=s.complaint_rate_threshold;sample.value=s.minimum_sample_size;status.value=s.status;reason.value=s.pause_reason||'';suppressions.innerHTML=d.active_suppressions.length?d.active_suppressions.map(x=>`<article><strong>${esc(x.email)}</strong><p>${esc(x.reason)}</p><button data-id="${esc(x.uuid)}">Release</button></article>`).join(''):'<p>No active suppressions.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const why=prompt('Reason for releasing this suppression?');if(!why)return;await request('/v1/admin/email-suppressions/'+b.dataset.id+'/release',{method:'POST',body:JSON.stringify({reason:why})});load()})}
settings.onsubmit=async e=>{e.preventDefault();await request('/v1/admin/email-reputation',{method:'PUT',body:JSON.stringify({bounce_rate_threshold:Number(bounce.value),complaint_rate_threshold:Number(complaint.value),minimum_sample_size:Number(sample.value),status:status.value,pause_reason:reason.value})});message.textContent='Reputation controls saved.';load()};load().catch(e=>message.textContent=e.message);
</script></body></html>
