<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Administration · WonderOS</title><link rel="stylesheet" href="./styles.css"><style>.admin-shell{max-width:1240px;margin:auto;padding:32px}.admin-head,.account-row,.action-row{display:flex;gap:14px;align-items:center;justify-content:space-between}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.account-list{display:grid;gap:9px}.account-row{width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:11px}.account-row span{display:block;color:var(--muted);font-size:12px}.account-row.active{border-color:var(--accent)}select,input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px}label{display:grid;gap:7px;margin:14px 0;color:var(--muted);font-size:13px}.activity{display:grid;gap:8px}.activity-item{padding:12px;background:var(--panel-2);border-radius:9px}.danger{border:1px solid #6b3333;color:#ffd2d2;background:transparent;border-radius:10px;padding:11px 15px}.muted{color:var(--muted)}@media(max-width:820px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="admin-shell"><header class="admin-head"><div><p class="eyebrow">Wonder Console</p><h1>Account Administration</h1><p class="muted">Create colleagues, govern their permissions and close access immediately when required.</p></div><div class="action-row"><a class="secondary" href="./lens-studio.html">Editorial lenses</a><button id="logout" class="secondary">Sign out</button></div></header>
<div id="message" class="card" hidden></div><section class="admin-grid"><aside class="card"><div class="admin-head"><h2>People</h2><button id="new-user" class="primary">New user</button></div><div id="user-list" class="account-list"><p class="muted">Loading accounts…</p></div></aside>
<section class="card"><form id="user-form"><p class="eyebrow" id="mode">Selected account</p><h2 id="form-title">Choose a colleague</h2><input type="hidden" name="uuid"><label>Display name<input name="display_name" required></label><label>Email<input name="email" type="email" required></label><label id="password-label">Temporary password<input name="password" type="password" minlength="12"></label><label>Role<select name="role"><option value="viewer">Viewer</option><option value="researcher">Researcher</option><option value="editor">Editor</option><option value="administrator">Administrator</option></select></label><label>Status<select name="status"><option value="active">Active</option><option value="suspended">Suspended</option></select></label><div class="action-row"><button class="primary" type="submit">Save account</button><button id="revoke" class="danger" type="button">Revoke all sessions</button></div></form><hr style="border-color:var(--line);margin:28px 0"><h3>Recent sessions</h3><div id="activity" class="activity"><p class="muted">Select an account to review its activity.</p></div></section></section></main><script src="./accounts.js" defer></script></body></html>
